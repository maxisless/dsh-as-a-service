# Local unattended DSH agent exposed through the Python SDK JSON-RPC runtime.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: high

# Reuse the provider selected in the user's existing ~/.dsh/settings.yaml.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js "JSON.parse(process.env.DSH_HTTP_PI_PROVIDERS_JSON ?? '{}')"

# Enforce workspace-write for filesystem mutation tools. Operations outside
# the workspace require approval; this unattended service has no approval
# answerer, so such requests fail closed. The native Bash runner is omitted
# because the current macOS Python runtime wheel cannot load its native PTY.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a capable local agent. Use available tools when needed, verify your work, and answer concisely.'
    workspaceContext:
      maxBytes: 65536
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './state/sessions'
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Expose DeepSeek server-side Web Search; arbitrary web_fetch remains disabled.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: !!js "!process.env.DEEPSEEK_API_KEY"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: !!js "!process.env.DEEPSEEK_API_KEY"
  config:
    fetch: false
    searchTimeoutMs: 60000
