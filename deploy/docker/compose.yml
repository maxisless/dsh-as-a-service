services:
  python-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BASE_IMAGE: ${DSH_BASE_IMAGE:-python:3.11-slim-bookworm}
    image: dsh-as-a-service-python:local
    init: true
    env_file:
      - .env
    environment:
      DSH_HTTP_HOST: 0.0.0.0
      DSH_HTTP_PORT: "8765"
      DSH_WORKSPACE: /data/workspace
      DSH_SESSION_ROOT: /data/state/sessions
      DSH_HTTP_CONVERSATION_ROOT: /data/state/conversations
      DSH_CONTROL_PLANE_ROOT: /data/state/control-plane
      PKG_CACHE_PATH: /data/state/pkg-cache
      DSH_HTTP_MODELS_CONFIG: /config/models.json
      DSH_HOME: /home/dsh/.dsh
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - dsh-python-data:/data
      - ./models.json:/config/models.json:ro
      - ./dsh-home:/home/dsh/.dsh:ro
    restart: unless-stopped

volumes:
  dsh-python-data:
